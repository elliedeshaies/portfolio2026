<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ellie Deshaies — UX Designer &amp; Researcher</title>
<meta name="description" content="Ellie Deshaies — research-led design for complex products. Senior UX Designer at JLL.">
<meta name="theme-color" content="#F3F0E6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F3F0E6'/%3E%3Ccircle cx='22' cy='10' r='3.5' fill='%23D0A02A'/%3E%3Cpath d='M3 25 L12 13 L17.5 19 L21.5 15.5 L29 25' fill='none' stroke='%2344603A' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F0E6;
    --ink: #26291F;
    --muted: #5C6650;
    --rule: #D8D3C0;
    --link: #D0A02A;
    --hover: #44603A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--link);
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
    transition: color .15s ease;
  }
  a:hover { color: var(--hover); }
  a:focus-visible { outline: 2px solid var(--hover); outline-offset: 4px; border-radius: 2px; }

  .page {
    min-height: 100vh;
    min-height: 100svh;
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 160px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 64px;
  }
  header { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .name { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: .01em; }
  .name svg { flex-shrink: 0; }
  nav { display: flex; gap: 32px; }
  nav a { padding: 12px 0; }

  main { max-width: 760px; display: flex; flex-direction: column; gap: 64px; }
  h1 {
    margin: 0;
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 5vw, 60px);
    line-height: 1.1;
    letter-spacing: -0.015em;
  }
  dl { margin: 0; display: grid; grid-template-columns: 140px minmax(0, 1fr); row-gap: 16px; column-gap: 24px; }
  dt { color: var(--muted); }
  dd { margin: 0; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding-top: 24px; border-top: 1px solid var(--rule);
    font-size: 14px; color: var(--muted);
  }
  footer a { font-size: 15px; color: var(--ink); }

  @media (max-width: 900px) {
    .page { padding: 40px 48px 48px; }
  }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    .page { padding: 28px 24px 32px; gap: 48px; }
    nav { gap: 20px; }
    main { gap: 40px; }
    h1 { line-height: 1.12; letter-spacing: -0.01em; }
    dl { display: flex; flex-direction: column; gap: 18px; }
    dl > div { display: flex; flex-direction: column; gap: 2px; }
    dt { font-size: 14px; }
    footer { flex-direction: column-reverse; align-items: flex-start; gap: 6px; padding-top: 20px; }
  }
  @media (min-width: 601px) { dl > div { display: contents; } }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="name">
      <svg aria-hidden="true" width="30" height="16" viewBox="0 0 30 16"><circle cx="21.5" cy="4" r="3" fill="#D0A02A"/><path d="M1 15 L9 5 L14 10 L18 7 L29 15" fill="none" stroke="#44603A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Ellie Deshaies
    </span>
    <nav aria-label="Contact">
      <a href="mailto:elliedeshaies.design@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/elliedeshaies" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </header>

  <main>
    <h1>Research-led design for complex products.</h1>
    <dl>
      <div><dt>Currently</dt><dd>Senior UX Designer at JLL</dd></div>
      <div><dt>Focus</dt><dd>Enterprise SaaS, user research, accessibility</dd></div>
      <div><dt>Work</dt><dd>Case studies in progress — <a href="mailto:elliedeshaies.design@gmail.com?subject=Case%20studies">available on request</a></dd></div>
    </dl>
  </main>

  <footer>
    <span>Colorado, USA</span>
    <a href="mailto:elliedeshaies.design@gmail.com">elliedeshaies.design@gmail.com</a>
  </footer>
</div>
</body>
</html>
